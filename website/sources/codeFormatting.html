<!DOCTYPE html>

<script>

let code = `
use std::os::unix::net::UnixStream;
use std::io::Write;
use std::env;

const SOCKET_PATH: &str = "/tmp/music-daemon.sock";

fn main() {

  let args: Vec<String> = env::args().skip(1).collect();

  if args.is_empty() {
    eprintln!("Usage: strawberry <command> <argument>");
    return;
  }

  let command = args.join(" ");

  match UnixStream::connect(SOCKET_PATH) {
    Ok(mut stream) => {
      let msg = format!("{}\n", command);
      if let Err(e) = stream.write_all(msg.as_bytes()) {
        eprintln!("Failed to send command : {}", e);
      }
    }
    Err(e) => eprintln!("Connection failed : {}", e)
  }

}
`

let start = 1
code = code.replaceAll("<", "&lt;").replaceAll(">", "&gt;")
let lines = code.split("\n")
lines = lines.splice(1, lines.length - 2)
let digits = lines.length.toString().length
let newLines = []
for (let line = 0; line < lines.length; line++) {newLines.push("0".repeat(digits - ((line + start).toString().length)) + (line + start).toString() + " " + lines[line])}
console.log(newLines.join("\n"))

</script>
