<!DOCTYPE html>

<script>

let code = `
use rodio::{Decoder, DeviceSinkBuilder, Player};
use std::os::unix::net::UnixListener;
use std::io::{BufReader, BufRead};
use std::fs::File;

const SOCKET_PATH: &str = "/tmp/music-daemon.sock";
const MUSIC_PATH: &str = "/home/bob/Music/Songs/";

fn main () {
  
  let stream_handle = DeviceSinkBuilder::open_default_sink().expect("audio stream failed");
  let player = Player::connect_new(stream_handle.mixer());

  let _ = std::fs::remove_file(SOCKET_PATH);
  let listener = UnixListener::bind(SOCKET_PATH).unwrap();
  println!("Daemon listening at {}", SOCKET_PATH);

  for stream in listener.incoming() {
    let stream = stream.unwrap();
    let reader = BufReader::new(stream);
    for line in reader.lines() {
      let line = line.unwrap();
      handle_command(&line, &player);
    }
  }

}

fn handle_command (line: &str, player: &Player) {

  let mut parts = line.splitn(2, ' ');
  let command = parts.next().unwrap_or("");
  let filename = parts.next().unwrap_or("");
  let arg = format!("{}{}", MUSIC_PATH, filename);
  
  match command {

    "play" => {
      match File::open(&arg) {
        Ok(file) => {
          match Decoder::new(BufReader::new(file)) {
            Ok(source) => {
              player.stop();
              player.append(source);
              player.play();
              println!("Playing {}", arg);
            }
            Err(e) => println!("Failed to decode {} : {}", arg, e),
          }
        }
        Err(e) => println!("Failed to load {} : {}", arg, e),
      }
    }

    "stop" => {
      player.stop();
    }

    _ => println!("Invalid command : {}", command),

  }

}
`

let start = 1
code = code.replaceAll("<", "&lt;").replaceAll(">", "&gt;")
let lines = code.split("\n")
lines = lines.splice(1, lines.length - 2)
let digits = lines.length.toString().length
let newLines = []
for (let line = 0; line < lines.length; line++) {newLines.push("0".repeat(digits - ((line + start).toString().length)) + (line + start).toString() + " " + lines[line])}
console.log(newLines.join("\n"))

</script>
